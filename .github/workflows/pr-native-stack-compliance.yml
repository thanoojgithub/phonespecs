name: PR Native Stack & Zero Frameworks Pre-Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: pr-native-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native_stack_audit:
    name: Verify Modern HTML5, Native CSS Grid, Pure Native JS (ES2026) & Zero Frameworks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Headless Node CLI Test Engine
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: "Step 1: Modern HTML & Native CSS Grid (Modern HTML5 & Semantic Structure Gate)"
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            if (!html.trim().startsWith("<!DOCTYPE html>")) {
              throw new Error("HTML5 standard DOCTYPE is missing from index.html");
            }
            if (!html.includes("width=device-width")) {
              throw new Error("Modern mobile-first responsive viewport meta tag is missing from index.html");
            }
            const semanticTags = ["<header", "<main", "<nav", "<section"];
            for (const tag of semanticTags) {
              if (!html.includes(tag)) {
                throw new Error("Modern semantic HTML5 element " + tag + " is missing from index.html");
              }
            }
            const css = fs.readFileSync("css/styles.css", "utf8");
            if (!css.includes("display: grid") && !css.includes("display:grid")) {
              throw new Error("Native CSS Grid layout declaration is missing from css/styles.css");
            }
            console.log("✅ Check 1 Passed: Modern HTML5 Semantic Structure and Native CSS Grid verified.");
          '

      - name: "Step 2: Pure Native JavaScript & ECMAScript 2026 (ES2026 / ECMA-262) Standards Gate"
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: node scripts/check_es2026_compliance.js

      - name: "Step 3: Zero 3rd-Party UI/UX Frameworks & Dependencies Gate"
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: node scripts/check_native_stack_compliance.js

      - name: "Step 4: Unified 100% Pre-Commit & PR Native Test Suite Runner"
        run: node scripts/run_all_tests.js
