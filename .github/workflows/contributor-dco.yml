name: Contributor DCO & License Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

jobs:
  dco-check:
    name: Verify Developer Certificate of Origin (DCO) & Sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Git Commit Sign-offs
        run: |
          echo "=========================================================="
          echo " Auditing Commits for Developer Certificate of Origin (DCO)"
          echo "=========================================================="

          # Compare commits between PR base and head
          COMMITS=$(git log --no-merges --format="%H" origin/${{ github.base_ref }}..HEAD)
          
          if [ -z "$COMMITS" ]; then
            echo "No commits found to audit."
            exit 0
          fi

          MISSING_SIGNOFF=0
          for COMMIT in $COMMITS; do
            AUTHOR=$(git log -1 --format="%an <%ae>" $COMMIT)
            MESSAGE=$(git log -1 --format="%B" $COMMIT)
            
            if ! echo "$MESSAGE" | grep -q -E "^Signed-off-by: "; then
              echo "::error::Commit $COMMIT by $AUTHOR is missing a 'Signed-off-by:' line."
              MISSING_SIGNOFF=1
            else
              SIGNOFF_LINE=$(echo "$MESSAGE" | grep -E "^Signed-off-by: " | head -n 1)
              echo "✓ Commit $COMMIT verified: $SIGNOFF_LINE"
            fi
          done

          if [ $MISSING_SIGNOFF -ne 0 ]; then
            echo ""
            echo "❌ Some commits lack DCO sign-off. Apache 2.0 requires contributors to sign off commits with 'git commit -s'."
            exit 1
          fi

          echo ""
          echo "✅ All PR commits satisfy Developer Certificate of Origin requirements."
