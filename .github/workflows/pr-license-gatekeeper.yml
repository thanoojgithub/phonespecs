name: PR Apache 2.0 License Gatekeeper

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write
  contents: read

jobs:
  gatekeeper:
    name: Apache 2.0 PR Verification & Auto-Labeler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run Full License Compliance Check
        id: compliance_check
        run: |
          node scripts/check_license_compliance.js

      - name: Verify PR Description for Apache 2.0 Acknowledgment
        run: |
          BODY="${{ github.event.pull_request.body }}"
          echo "Inspecting pull request description..."
          # Verify that PR does not contain conflicting proprietary or incompatible license claims
          if echo "$BODY" | grep -i -E "(GPL|AGPL|proprietary|all rights reserved|commercial use only)"; then
            echo "::warning::PR description references terms that may conflict with Apache License 2.0 compatibility."
          fi
          echo "✓ Pull request description inspected."
