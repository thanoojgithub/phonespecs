name: PR Pre-Checks & Pure Native Stack Gatekeeper

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_architectural_prechecks:
    name: Pure Native Architecture & 100% Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Headless CLI Test Engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Precheck 1 - Pure Native Stack & Zero-Framework Architecture Audit
        run: node scripts/check_native_stack_compliance.js

      - name: Precheck 2 - Modern HTML5, Semantic Elements & Mobile-First Viewport
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            if (!html.includes("<!DOCTYPE html>")) throw new Error("Missing HTML5 doctype");
            if (!html.includes("width=device-width")) throw new Error("Missing mobile-first viewport meta");
            if (!html.includes("<header") || !html.includes("<main") || !html.includes("<nav")) throw new Error("Missing HTML5 semantic landmark elements");
            console.log("✓ HTML5 Mobile-First structure passed");
          '

      - name: Precheck 3 - Native CSS Grid & Zero Tailwind/Bootstrap Audit
        run: |
          node -e '
            const fs = require("fs");
            const css = fs.readFileSync("css/styles.css", "utf8");
            if (!css.includes("display: grid") && !css.includes("display:grid")) throw new Error("Missing Native CSS Grid layout");
            if (css.includes("@tailwind") || css.includes("tailwindcss")) throw new Error("Tailwind forbidden");
            if (css.includes("bootstrap")) throw new Error("Bootstrap forbidden");
            console.log("✓ Modern Native CSS Grid and 0% Tailwind/Bootstrap passed");
          '

      - name: Precheck 4 - Validate Catalog Data Integrity
        run: node scripts/validate_catalog.js

      - name: Precheck 5 - Pure Native JS Test Suite Execution (0% external test frameworks)
        run: |
          node scripts/test_catalog_crud.js
          node scripts/test_audit_service.js
          node scripts/test_json_formatter.js
          node scripts/test_app_controller.js
          node scripts/run_all_tests.js

      - name: Precheck 6 - Enforce 100% Code Coverage Policy for PR
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: node scripts/check_code_coverage.js

      - name: Precheck 7 - Verify Apache License 2.0 Compliance
        run: node scripts/check_license_compliance.js
