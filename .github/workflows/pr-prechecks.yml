name: PR Pre-Checks Build Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: pr-prechecks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_prechecks:
    name: PR Code Pre-Checks & Compliance Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Headless Node CLI Test Engine
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: "Check 1: Modern HTML5, Mobile-First Viewport & SPA Structure"
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            if (!html.trim().startsWith("<!DOCTYPE html>")) {
              throw new Error("HTML5 DOCTYPE missing at start of index.html");
            }
            if (!html.includes("width=device-width")) {
              throw new Error("Mobile-first viewport meta tag missing in index.html");
            }
            if (!html.includes("<header") || !html.includes("<main") || !html.includes("<nav")) {
              throw new Error("Modern HTML5 semantic elements (<header>, <main>, <nav>) missing");
            }
            console.log("✓ Check 1 Passed: Modern HTML5 Mobile-First SPA architecture verified.");
          '

      - name: "Check 2: Modern Native CSS Grid Layout & 0% Tailwind/Bootstrap"
        run: |
          node -e '
            const fs = require("fs");
            const css = fs.readFileSync("css/styles.css", "utf8");
            if (!css.includes("display: grid") && !css.includes("display:grid")) {
              throw new Error("Native CSS Grid layout declaration missing from css/styles.css");
            }
            if (css.includes("@tailwind") || css.includes("--tw-") || css.includes("tailwindcss")) {
              throw new Error("Tailwind CSS artifacts/classes detected! Only Native Vanilla CSS is permitted.");
            }
            if (css.includes("bootstrap") || css.includes(".col-md-") || css.includes(".container-fluid")) {
              throw new Error("Bootstrap artifacts/classes detected! Only Native Vanilla CSS is permitted.");
            }
            console.log("✓ Check 2 Passed: Modern Native CSS Grid and 0% Tailwind/Bootstrap verified.");
          '

      - name: "Check 3: Zero External Third-Party Dependencies (100% Pure Native Stack)"
        run: node scripts/check_native_stack_compliance.js

      - name: "Check 4: 100% Apache License 2.0 Compliance"
        run: |
          if [ ! -f "LICENSE" ]; then
            echo "✗ Missing LICENSE file"
            exit 1
          fi
          if [ ! -f "NOTICE" ]; then
            echo "✗ Missing NOTICE file"
            exit 1
          fi
          node scripts/check_license_compliance.js

      - name: "Check 5: Pure Native JavaScript Test Suite Execution (0% external test frameworks)"
        run: |
          node scripts/test_catalog_crud.js
          node scripts/test_audit_service.js
          node scripts/test_json_formatter.js
          node scripts/test_app_controller.js
          node scripts/run_all_tests.js

      - name: "Check 6: 100% Code Coverage Enforcement (Pure Native JS Tests Only)"
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: node scripts/check_code_coverage.js

      - name: "Check 7: Validate Catalog JSON Integrity"
        run: node scripts/validate_catalog.js
