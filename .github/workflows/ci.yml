name: Quality & License Compliance CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Data Integrity & License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up Headless Node CLI Test Engine
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Validate Catalog JSON Integrity
        run: node scripts/validate_catalog.js

      - name: Run Native JS Catalog CRUD Test Suite
        run: node scripts/test_catalog_crud.js

      - name: Run Native JS Versioned Audit Test Suite
        run: node scripts/test_audit_service.js

      - name: Run Native JS JSON Formatter & Sanitizer Test Suite
        run: node scripts/test_json_formatter.js

      - name: Run Native JS PhoneSpecsApp Controller & UI State Test Suite
        run: node scripts/test_app_controller.js

      - name: Execute Full 100% Test Suite Runner
        run: node scripts/run_all_tests.js

      - name: Verify Pure Native Stack & Zero-Framework Compliance
        run: node scripts/check_native_stack_compliance.js

      - name: Check Apache 2.0 Compliance Files
        run: |
          if [ ! -f "LICENSE" ]; then
            echo "✗ Missing LICENSE file"
            exit 1
          fi
          if [ ! -f "NOTICE" ]; then
            echo "✗ Missing NOTICE file"
            exit 1
          fi
          echo "✓ LICENSE and NOTICE files present."

      - name: Verify Apache 2.0 License Compliance
        run: node scripts/check_license_compliance.js
