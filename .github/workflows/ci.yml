name: Quality & License Compliance CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Data Integrity & License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Catalog JSON Integrity
        run: node scripts/validate_catalog.js

      - name: Check Apache 2.0 Compliance Files
        run: |
          if [ ! -f "LICENSE" ]; then
            echo "✗ Missing LICENSE file"
            exit 1
          fi
          if [ ! -f "NOTICE" ]; then
            echo "✗ Missing NOTICE file"
            exit 1
          fi
          echo "✓ LICENSE and NOTICE files present."

      - name: Verify Apache License Headers
        run: |
          for file in index.html css/styles.css js/app.js Dockerfile scripts/validate_catalog.js; do
            if ! grep -q "Licensed under the Apache License, Version 2.0" "$file"; then
              echo "✗ Missing Apache 2.0 header in $file"
              exit 1
            fi
            echo "✓ Apache 2.0 header found in $file"
          done
