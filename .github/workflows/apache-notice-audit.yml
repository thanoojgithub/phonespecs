name: Apache 2.0 Notice & Trademark Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-legal:
    name: Audit NOTICE, Disclaimers & SPDX Headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verify Apache 2.0 Core License Text
        run: |
          echo "Auditing LICENSE file..."
          test -f LICENSE || { echo "::error file=LICENSE::Missing root LICENSE file"; exit 1; }
          grep -q "Apache License" LICENSE || { echo "::error file=LICENSE::Invalid LICENSE header"; exit 1; }
          grep -q "Version 2.0, January 2004" LICENSE || { echo "::error file=LICENSE::Invalid LICENSE version"; exit 1; }
          grep -q "http://www.apache.org/licenses/" LICENSE || { echo "::error file=LICENSE::Missing official Apache URL"; exit 1; }
          echo "✓ LICENSE file text is 100% compliant."

      - name: Verify Apache NOTICE & Third-Party Attributions
        run: |
          echo "Auditing NOTICE file..."
          test -f NOTICE || { echo "::error file=NOTICE::Missing root NOTICE file"; exit 1; }
          grep -q "PhoneSpecs" NOTICE || { echo "::error file=NOTICE::NOTICE missing product title"; exit 1; }
          grep -q "Copyright 2026 Thanooj Kalathuru" NOTICE || { echo "::error file=NOTICE::NOTICE missing copyright declaration"; exit 1; }
          grep -q "Apache License, Version 2.0" NOTICE || { echo "::error file=NOTICE::NOTICE missing Apache License reference"; exit 1; }
          grep -q "Trademark" NOTICE || { echo "::error file=NOTICE::NOTICE missing Trademark Disclaimer"; exit 1; }
          grep -q "Warranty & Liability" NOTICE || { echo "::error file=NOTICE::NOTICE missing Warranty & Liability Disclaimer"; exit 1; }
          echo "✓ NOTICE file attributions and disclaimers are 100% compliant."

      - name: Verify Web UI Disclaimers in index.html
        run: |
          echo "Auditing in-app trademark and liability notices in index.html..."
          grep -q "Trademark Disclaimer:" index.html || { echo "::error file=index.html::Missing on-page Trademark Disclaimer"; exit 1; }
          grep -q "Disclaimer of Warranty &amp; Liability:" index.html || { echo "::error file=index.html::Missing on-page Warranty & Liability Disclaimer"; exit 1; }
          grep -q "Apache License 2.0" index.html || { echo "::error file=index.html::Missing Apache License 2.0 footer link"; exit 1; }
          echo "✓ In-app legal disclaimers verified in index.html footer."

      - name: Verify Source Files Header Uniformity
        run: node scripts/check_license_compliance.js
